<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="color-scheme" content="light">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Interview Profile Quiz</title>

  <meta
    name="description"
    content="A classroom-ready university interview profile quiz for M.6 students."
  >

  <style>
    :root {
      --primary: #613992;
      --primary-dark: #3b1e5d;
      --primary-light: #eee8fa;
      --background: #f5f3fa;
      --card: #ffffff;
      --text: #222222;
      --muted: #666666;
      --border: #ded9e8;
      --danger: #9d2020;
      --danger-light: #ffe5e5;
      --active-gold: #f1c84c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    .quiz-container {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 30px;
      max-width: 1200px;
      margin: auto;
      align-items: start;
    }

    .quiz-panel,
    .progress-panel {
      padding: 28px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .progress-panel {
      position: sticky;
      top: 20px;
    }

    .app-header {
      margin-bottom: 22px;
    }

    .app-header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .app-subtitle {
      margin: 0;
      color: var(--muted);
    }

    /* Student information start screen */

    body.student-start .quiz-container {
      display: block;
      max-width: 760px;
    }

    body.student-start .progress-panel,
    body.student-start .navigation,
    body.student-start .stage-text,
    body.student-start .error-message {
      display: none !important;
    }

    .student-start-card {
      padding: 24px;
      background: #faf9fd;
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      border-radius: 14px;
    }

    .student-start-card h2 {
      margin: 0 0 8px;
      color: var(--primary-dark);
    }

    .student-start-card > p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
    }

    .student-form-error {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      color: var(--danger);
      background: var(--danger-light);
      border-radius: 8px;
    }

    .student-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .student-field.full-width {
      grid-column: 1 / -1;
    }

    .student-field label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .student-field input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #bbbbbb;
      border-radius: 8px;
    }

    .student-field input:focus {
      border-color: var(--primary);
      outline: 3px solid var(--primary-light);
    }

    .start-quiz-button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 24px;
      color: white;
      background: var(--primary);
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-quiz-button:hover {
      background: var(--primary-dark);
    }

    /* Saved-profile choice screen */

    body.resume-choice .quiz-container {
      display: block;
      max-width: 760px;
    }

    body.resume-choice .progress-panel,
    body.resume-choice .navigation,
    body.resume-choice .stage-text,
    body.resume-choice .error-message {
      display: none !important;
    }

    .resume-card {
      padding: 24px;
      background: #faf9fd;
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      border-radius: 14px;
    }

    .resume-card h2 {
      margin: 0 0 8px;
      color: var(--primary-dark);
    }

    .resume-card > p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    .saved-profile-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
      padding: 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .saved-profile-item span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .saved-profile-item strong {
      display: block;
      color: var(--primary-dark);
      overflow-wrap: anywhere;
    }

    .resume-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .resume-actions button {
      padding: 13px 18px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #continue-profile-button {
      color: white;
      background: var(--primary);
    }

    #continue-profile-button:hover {
      background: var(--primary-dark);
    }

    #new-profile-button {
      color: #8a1f1f;
      background: #f2dede;
    }

    .stage-text {
      margin: 0 0 18px;
      color: var(--primary);
      font-weight: bold;
    }

    .error-message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      color: var(--danger);
      background: var(--danger-light);
      border-radius: 8px;
    }

    #quiz-content h2 {
      margin-top: 0;
      color: var(--primary-dark);
    }

    .question-card {
      margin-bottom: 20px;
      padding: 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .question-card label {
      display: block;
      margin-bottom: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 78px;
      padding: 12px;
      font-size: 16px;
      line-height: 1.5;
      border: 1px solid #bbbbbb;
      border-radius: 8px;
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--primary);
      outline: 3px solid var(--primary-light);
    }

    .example-button {
      margin-top: 10px;
      padding: 8px 12px;
      color: var(--primary-dark);
      background: var(--primary-light);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .example-button:hover {
      background: #ded1f5;
    }

    .example-box {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #f7f3fd;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 25px;
    }

    .navigation button {
      min-width: 110px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
    }

    .navigation button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #back-button {
      background: #dddddd;
    }

    #next-button {
      color: white;
      background: var(--primary);
    }

    #next-button:hover {
      background: var(--primary-dark);
    }

    .progress-panel h2 {
      margin: 0 0 6px;
      text-align: center;
      color: var(--primary-dark);
    }

    .progress-status {
      margin: 0 0 15px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .student-image-wrapper {
      display: flex;
      justify-content: center;
      min-height: 260px;
      margin-bottom: 18px;
    }

    #student-image {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
    }

    /* Pyramid */

    .pyramid {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin: 12px auto 0;
    }

    .pyramid-layer {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 58px;
      margin-top: -2px;
      padding: 9px 24px;
      text-align: center;
      color: white;
      clip-path: polygon(
        8% 0,
        92% 0,
        100% 100%,
        0 100%
      );
      transition:
        opacity 0.35s ease,
        filter 0.35s ease,
        transform 0.3s ease;
    }

    .pyramid-layer.goal {
      width: 58%;
      background: #3b1e5d;
    }

    .pyramid-layer.achievements {
      width: 68%;
      background: #47266e;
    }

    .pyramid-layer.experiences {
      width: 76%;
      background: #542f80;
    }

    .pyramid-layer.strengths {
      width: 84%;
      background: #613992;
    }

    .pyramid-layer.interests {
      width: 92%;
      background: #6f44a4;
    }

    .pyramid-layer.improve {
      width: 100%;
      background: #7d50b6;
    }

    .pyramid-layer.locked {
      opacity: 0.2;
      filter: grayscale(1);
    }

    .pyramid-layer.completed {
      opacity: 1;
      filter: none;
    }

    .pyramid-layer.current {
      opacity: 1;
      filter: none;
      transform: scale(1.025);
      outline: 4px solid var(--active-gold);
      outline-offset: 2px;
      z-index: 2;
    }

    .layer-title {
      display: block;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.4px;
    }

    .layer-prompt {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      line-height: 1.25;
    }

    .pyramid-note {
      margin: 14px 0 0;
      padding: 10px;
      text-align: center;
      color: var(--primary-dark);
      background: var(--primary-light);
      border-radius: 8px;
      font-size: 13px;
    }

    /* Completed profile */

    body.profile-complete .quiz-container {
      display: block;
      max-width: 1000px;
    }

    body.profile-complete .progress-panel {
      display: none;
    }

    .profile-cover {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 28px;
      align-items: center;
      margin-bottom: 30px;
      padding: 28px;
      color: white;
      background: linear-gradient(
        135deg,
        #3b1e5d,
        #613992
      );
      border-radius: 18px;
    }

    .profile-cover h2 {
      margin: 6px 0 12px;
      color: white !important;
      font-size: 34px;
    }

    .profile-cover p {
      line-height: 1.5;
    }

    .cover-label {
      margin: 0;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .goal-highlight {
      margin-top: 22px;
      padding: 15px;
      color: var(--primary-dark);
      background: white;
      border-radius: 12px;
    }

    .goal-highlight span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .goal-highlight strong {
      display: block;
      font-size: 18px;
      line-height: 1.4;
    }

    .student-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .student-detail {
      padding: 11px;
      color: var(--primary-dark);
      background: rgba(255, 255, 255, 0.96);
      border-radius: 10px;
    }

    .student-detail.full-width {
      grid-column: 1 / -1;
    }

    .student-detail span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .student-detail strong {
      display: block;
      overflow-wrap: anywhere;
    }

    .cover-visual {
      padding: 18px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 15px;
    }

    .final-student-image {
      display: block;
      width: 100%;
      max-height: 220px;
      margin: 0 auto 12px;
      object-fit: contain;
    }

    .final-pyramid .pyramid-layer {
      min-height: 42px;
      padding: 6px 18px;
    }

    .final-pyramid .layer-title {
      font-size: 11px;
    }

    .final-pyramid .layer-prompt {
      font-size: 8px;
    }

    .profile-introduction {
      margin: 0 0 22px;
      padding: 16px;
      text-align: center;
      color: var(--primary-dark);
      background: var(--primary-light);
      border-radius: 10px;
    }

    .profile-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      text-align: left;
    }

    .profile-section {
      position: relative;
      padding: 20px;
      background: #faf9fd;
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      border-radius: 14px;
      break-inside: avoid;
    }

    .profile-section:first-child {
      grid-column: 1 / -1;
    }

    .profile-section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .profile-section-number {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      color: white;
      background: var(--primary);
      border-radius: 50%;
      font-weight: bold;
    }

    .profile-section h3 {
      margin: 0;
      color: var(--primary-dark);
    }

    .profile-item {
      margin-top: 14px;
    }

    .profile-question {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: bold;
      color: #4c4c4c;
    }

    .profile-answer {
      margin: 0;
      padding: 11px;
      line-height: 1.45;
      background: white;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      overflow-wrap: anywhere;
    }

    .completion-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .completion-actions button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
    }

    #edit-profile-button {
      background: #dddddd;
    }

    #print-profile-button {
      color: white;
      background: var(--primary);
    }

    #restart-button {
      color: #8a1f1f;
      background: #f2dede;
    }

    @media (max-width: 850px) {
      body {
        padding: 15px;
      }

      .quiz-container {
        grid-template-columns: 1fr;
      }

      .progress-panel {
        position: static;
        order: -1;
      }

      .student-image-wrapper {
        min-height: 180px;
      }

      #student-image {
        max-height: 280px;
      }

      .profile-cover {
        grid-template-columns: 1fr;
      }

      .profile-summary {
        grid-template-columns: 1fr;
      }

      .profile-section:first-child {
        grid-column: auto;
      }

      .student-fields,
      .student-details,
      .saved-profile-summary,
      .resume-actions {
        grid-template-columns: 1fr;
      }

      .student-field.full-width,
      .student-detail.full-width {
        grid-column: auto;
      }
    }

    /* Printing / PDF */

    @page {
      size: A4;
      margin: 12mm;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body {
        padding: 0;
        background: white;
        font-size: 11pt;
      }

      .quiz-container {
        display: block;
        max-width: none;
      }

      .quiz-panel {
        padding: 0;
        box-shadow: none;
      }

      .app-header,
      .progress-panel,
      .navigation,
      .completion-actions,
      .stage-text,
      .error-message {
        display: none !important;
      }

      .profile-cover {
        grid-template-columns: 1fr 320px;
        gap: 18px;
        margin-bottom: 18px;
        padding: 20px;
        border-radius: 10px;
        break-inside: avoid;
      }

      .profile-cover h2 {
        font-size: 25px;
      }

      .final-student-image {
        max-height: 160px;
      }

      .final-pyramid .pyramid-layer {
        min-height: 31px;
        padding: 4px 14px;
      }

      .final-pyramid .layer-title {
        font-size: 8px;
      }

      .final-pyramid .layer-prompt {
        display: none;
      }

      .profile-introduction {
        margin-bottom: 14px;
        padding: 10px;
      }

      .profile-summary {
        display: block;
      }

      .profile-section {
        margin-bottom: 12px;
        padding: 14px;
        border-radius: 8px;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .profile-section-header {
        margin-bottom: 9px;
      }

      .profile-section-number {
        width: 25px;
        height: 25px;
        flex-basis: 25px;
        font-size: 10px;
      }

      .profile-section h3 {
        font-size: 15px;
      }

      .profile-item {
        margin-top: 8px;
      }

      .profile-question {
        margin-bottom: 3px;
        font-size: 10px;
      }

      .profile-answer {
        padding: 7px;
        font-size: 10px;
      }
    }

    /* Final classroom hardening and deployment-ready additions */

    button,
    input,
    textarea {
      min-height: 44px;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    [tabindex="-1"]:focus-visible {
      outline: 3px solid var(--active-gold);
      outline-offset: 3px;
    }

    .storage-notice,
    .shared-device-warning {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 9px;
      line-height: 1.45;
    }

    .storage-notice {
      color: #4b3a12;
      background: #fff5cf;
      border: 1px solid #ead68a;
    }

    .shared-device-warning {
      color: #5f3312;
      background: #fff1e5;
      border-left: 5px solid #d77b2b;
    }

    .identity-check {
      margin: 0 0 18px;
      padding: 16px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .identity-check label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .identity-check input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #bbbbbb;
      border-radius: 8px;
    }

    .identity-help {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .identity-error {
      display: none;
      margin: 10px 0 0;
      color: var(--danger);
      font-weight: bold;
    }

    .char-count {
      display: block;
      margin-top: 6px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
    }

    textarea[aria-invalid="true"],
    input[aria-invalid="true"] {
      border-color: var(--danger);
      outline: 2px solid var(--danger-light);
    }

    .image-fallback,
    .final-image-fallback {
      width: 100%;
      padding: 18px;
      text-align: center;
      color: var(--primary-dark);
      background: var(--primary-light);
      border: 1px dashed var(--primary);
      border-radius: 12px;
      line-height: 1.45;
    }

    .student-image-wrapper {
      flex-direction: column;
      align-items: center;
    }

    .profile-print-meta {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.9;
    }

    .profile-footer {
      margin-top: 28px;
      padding-top: 12px;
      text-align: center;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.5;
    }

    .profile-section.section-color-0 {
      border-top-color: #3b1e5d;
    }

    .profile-section.section-color-0 .profile-section-number {
      background: #3b1e5d;
    }

    .profile-section.section-color-1 {
      border-top-color: #47266e;
    }

    .profile-section.section-color-1 .profile-section-number {
      background: #47266e;
    }

    .profile-section.section-color-2 {
      border-top-color: #542f80;
    }

    .profile-section.section-color-2 .profile-section-number {
      background: #542f80;
    }

    .profile-section.section-color-3 {
      border-top-color: #613992;
    }

    .profile-section.section-color-3 .profile-section-number {
      background: #613992;
    }

    .profile-section.section-color-4 {
      border-top-color: #6f44a4;
    }

    .profile-section.section-color-4 .profile-section-number {
      background: #6f44a4;
    }

    .profile-section.section-color-5 {
      border-top-color: #7d50b6;
    }

    .profile-section.section-color-5 .profile-section-number {
      background: #7d50b6;
    }

    #restart-quiz-button {
      color: #4c3b10;
      background: #fff0b8;
    }

    #finish-clear-button {
      color: white;
      background: #8a1f1f;
    }

    #finish-clear-button:hover {
      background: #6f1717;
    }

    .cleared-card {
      padding: 30px;
      text-align: center;
      background: #faf9fd;
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      border-radius: 14px;
    }

    .cleared-card h2 {
      margin-top: 0;
      color: var(--primary-dark);
    }

    .cleared-card p {
      line-height: 1.55;
      color: var(--muted);
    }

    .cleared-card button {
      margin-top: 12px;
      padding: 13px 22px;
      color: white;
      background: var(--primary);
      border: none;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Compact progress above the quiz on phones and iPad portrait */

    /* Pastel interview-profile redesign */

    :root {
      --primary: #8250c7;
      --primary-dark: #2d145a;
      --primary-light: #f1eafd;
      --lavender: #c9a8ef;
      --pink: #f2b9da;
      --blue: #addcf5;
      --mint: #a8e3df;
      --yellow: #ffe49b;
      --background: #f8f6fc;
      --card: #ffffff;
      --text: #151427;
      --muted: #6f6a7d;
      --border: #e7dff2;
      --active-gold: #f2bd35;
    }

    body {
      min-height: 100vh;
      padding: 26px;
      background:
        radial-gradient(circle at 8% 12%, rgba(242,185,218,.23), transparent 24%),
        radial-gradient(circle at 92% 10%, rgba(173,220,245,.22), transparent 24%),
        linear-gradient(180deg, #fbf9ff 0%, #f5f1fb 100%);

    .quiz-panel,

      box-shadow: 0 18px 50px rgba(71, 41, 106, .10);
    }

    .quiz-panel {
      padding: 34px 38px;
    }

    .progress-panel {
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.98), rgba(252,249,255,.98));

    .app-header {
      position: relative;
      padding-left: 76px;
      margin-bottom: 28px;
    }

    .app-header::before {
      content: "✦";
      position: absolute;
      left: 0;
      top: -2px;
      display: grid;
      place-items: center;
      width: 58px;
      height: 66px;
      color: white;
      font-size: 25px;
      background:
        linear-gradient(145deg, #9e72dc, #6232a4);
      border: 4px solid #efe5ff;
      border-radius: 18px 18px 24px 24px;
      box-shadow: 0 8px 22px rgba(100, 54, 156, .22);

    .app-header h1 {

    .app-subtitle {

    .stage-text {

      background: #f2eafd;

    .section-stepper {
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0;
      margin: 0 0 28px;
      padding: 0 12px;
    }

    .section-stepper::before {
      content: "";
      position: absolute;
      z-index: 0;
      left: 8%;
      right: 8%;
      top: 18px;
      height: 3px;
      background: #e5dfeb;
      border-radius: 99px;

    .step-dot {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      justify-self: center;
      width: 38px;
      height: 38px;
      color: #8f8997;

    .step-dot.completed {

    .pyramid-layer {

    /* Pyramid rebuilt to match the layered reference */
    .pyramid {
      position: relative;
      gap: 5px;
      padding-top: 32px;
      margin-top: 8px;
    }

    .pyramid::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 20px solid #8750c7;
      transform: translateX(-50%);
      filter: drop-shadow(0 4px 5px rgba(87, 44, 132, .18));
    }

    .pyramid-layer {
      --layer-strong: #8750c7;
      --layer-light: #d7baf2;
      position: relative;
      display: grid;
      grid-template-columns: 32% 68%;
      align-items: stretch;
      justify-content: stretch;
      min-height: 72px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #251d31;
      background: linear-gradient(90deg, var(--layer-strong) 0 32%, var(--layer-light) 32% 100%);
      border: 2px solid rgba(255, 255, 255, .78);
      border-radius: 18px 18px 15px 15px;
      clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
      box-shadow:
        0 8px 15px rgba(66, 39, 91, .10),
        inset 0 0 0 1px rgba(66, 39, 91, .06);
      transform-origin: center;
    }

    .pyramid-layer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 32%;
      width: 1px;
      background: rgba(255, 255, 255, .58);
      box-shadow: 1px 0 0 rgba(62, 36, 85, .06);
    }

    .pyramid-layer.goal {
      --layer-strong: #8f51ce;
      --layer-light: #d1b0ee;
      width: 62%;
    }

    .pyramid-layer.achievements {
      --layer-strong: #9d79cd;
      --layer-light: #d9c5ef;
      width: 70%;

      return icons[sectionIndex] || icons[0];
    }

    function clearSectionTheme() {
      document.body.classList.remove(...themeClassNames);
      document.body.style.removeProperty("--current-step");
    }

    function applySectionTheme(sectionIndex) {
      clearSectionTheme();
      const theme = sectionThemes[sectionIndex] || sectionThemes[0];
      document.body.classList.add(theme.className);
      document.body.style.setProperty("--current-step", String(sectionIndex + 1));
    }

    const STORAGE_KEY = "myInterviewProfileQuizStateV2";
    const LEGACY_STORAGE_KEYS = [
      "myInterviewProfileQuizStateV1"
    ];
    const STORAGE_VERSION = 2;
    const MAX_ANSWER_LENGTH = 600;
    const MAX_NAME_LENGTH = 100;
    const MAX_SHORT_FIELD_LENGTH = 40;

    let currentSection = 0;
    let completedCount = 0;
    let quizStarted = false;
    let profileComplete = false;
    let startupNotice = "";

    const answers = quizSections.map(() => ["", "", ""]);

    const studentInfo = {
      fullName: "",
      nickname: "",
      className: "",
      studentNumber: ""
    };

    const quizContent =
      document.getElementById("quiz-content");

    const stageText =
      document.getElementById("stage-text");

    const studentImage =
      document.getElementById("student-image");

    const studentImageFallback =
      document.getElementById("student-image-fallback");

    const pyramidContainer =
      document.getElementById("pyramid-container");

    const progressStatus =
      document.getElementById("progress-status");

    const backButton =
      document.getElementById("back-button");

    const nextButton =
      document.getElementById("next-button");

    const errorMessage =
      document.getElementById("error-message");

    function escapeHTML(value) {
      const characters = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      };

      return String(value).replace(
        /[&<>"']/g,
        character => characters[character]
      );
    }

    function formatAnswer(value) {
      return escapeHTML(value).replace(/\n/g, "<br>");
    }

    function sanitizeText(value, maxLength) {
      if (typeof value !== "string") {
        return "";
      }

      return value.slice(0, maxLength);
    }

    function clampNumber(value, minimum, maximum) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return minimum;
      }

      return Math.min(
        Math.max(Math.trunc(number), minimum),
        maximum
      );
    }

    function maskStudentNumber(value) {
      const cleanValue = String(value || "").trim();

      if (cleanValue.length <= 2) {
        return "••";
      }

      return `${"•".repeat(
        Math.max(cleanValue.length - 2, 2)
      )}${cleanValue.slice(-2)}`;
    }

    function formatDateTime(date) {
      try {
        return new Intl.DateTimeFormat(
          "en-GB",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        ).format(date);
      } catch (error) {
        return date.toLocaleString();
      }
    }

    function showStartupNotice() {
      if (!startupNotice) {
        return "";
      }

      return `
        <div
          class="storage-notice"
          role="status"
        >
          ${escapeHTML(startupNotice)}
        </div>
      `;
    }

    function getStorageKeys() {
      return [STORAGE_KEY, ...LEGACY_STORAGE_KEYS];
    }

    function getAvailableStorages() {
      const storages = [];

      try {
        const testKey = "__interviewQuizStorageTest__";
        localStorage.setItem(testKey, "1");
        localStorage.removeItem(testKey);
        storages.push({
          name: "localStorage",
          storage: localStorage
        });
      } catch (error) {
        console.warn("localStorage is unavailable.", error);
      }

      try {
        const testKey = "__interviewQuizSessionTest__";
        sessionStorage.setItem(testKey, "1");
        sessionStorage.removeItem(testKey);
        storages.push({
          name: "sessionStorage",
          storage: sessionStorage
        });
      } catch (error) {
        console.warn("sessionStorage is unavailable.", error);
      }

      return storages;
    }

    function clearSavedState() {
      const storages = getAvailableStorages();

      storages.forEach(({ storage }) => {
        getStorageKeys().forEach(key => {
          try {
            storage.removeItem(key);
          } catch (error) {
            console.warn(
              "Saved progress could not be cleared.",
              error
            );
          }
        });
      });
    }

    function buildStateSnapshot() {
      const safeAnswers = answers.map(sectionAnswers =>
        sectionAnswers.map(answer =>
          sanitizeText(answer, MAX_ANSWER_LENGTH)
        )
      );

      return {
        version: STORAGE_VERSION,
        savedAt: Date.now(),
        quizStarted,
        profileComplete,
        currentSection,
        completedCount,
        studentInfo: {
          fullName: sanitizeText(
            studentInfo.fullName,
            MAX_NAME_LENGTH
          ),
          nickname: sanitizeText(
            studentInfo.nickname,
            MAX_SHORT_FIELD_LENGTH
          ),
          className: sanitizeText(
            studentInfo.className,
            MAX_SHORT_FIELD_LENGTH
          ),
          studentNumber: sanitizeText(
            studentInfo.studentNumber,
            MAX_SHORT_FIELD_LENGTH
          )
        },
        answers: safeAnswers
      };
    }

    function saveState() {
      const state = buildStateSnapshot();
      const serializedState = JSON.stringify(state);
      const storages = getAvailableStorages();

      let savedSuccessfully = false;

      storages.forEach(({ storage }) => {
        try {
          storage.setItem(
            STORAGE_KEY,
            serializedState
          );

          LEGACY_STORAGE_KEYS.forEach(key => {
            storage.removeItem(key);
          });

          savedSuccessfully = true;
        } catch (error) {
          console.warn(
            "Progress could not be saved in one browser storage.",
            error
          );
        }
      });

      if (!savedSuccessfully) {
        startupNotice =
          "Automatic saving is unavailable in this browser. Keep this page open until you finish.";
      }

      return savedSuccessfully;
    }

    function findSavedState() {
      const candidates = [];
      const storages = getAvailableStorages();

      storages.forEach(({ name, storage }) => {
        getStorageKeys().forEach(key => {
          try {
            const value = storage.getItem(key);

            if (!value) {
              return;
            }

            let parsed = null;

            try {
              parsed = JSON.parse(value);
            } catch (error) {
              console.warn(
                `Ignoring damaged saved progress from ${name}.`,
                error
              );
              return;
            }

            candidates.push({
              key,
              value,
              storageName: name,
              savedAt: Number(parsed?.savedAt) || 0
            });
          } catch (error) {
            console.warn(
              `Saved progress could not be accessed from ${name}.`,
              error
            );
          }
        });
      });

      if (!candidates.length) {
        if (!storages.length) {
          startupNotice =
            "Automatic saving is unavailable in this browser. Keep this page open until you finish.";
        }

        return null;
      }

      candidates.sort(
        (a, b) => b.savedAt - a.savedAt
      );

      return candidates[0];
    }

    function loadSavedState() {
      const stored = findSavedState();

      if (!stored) {
        return false;
      }

      let savedState;

      try {
        savedState = JSON.parse(stored.value);
      } catch (error) {
        clearSavedState();

        startupNotice =
          "Damaged saved progress was found and safely cleared. Start a new profile.";

        return false;
      }

      const supportedVersion =
        savedState &&
        [1, STORAGE_VERSION].includes(
          Number(savedState.version)
        );

      if (
        !supportedVersion ||
        !Array.isArray(savedState.answers)
      ) {
        clearSavedState();

        startupNotice =
          "Outdated or incomplete saved progress was safely cleared. Start a new profile.";

        return false;
      }

      const savedStudentInfo =
        savedState.studentInfo || {};

      studentInfo.fullName = sanitizeText(
        savedStudentInfo.fullName,
        MAX_NAME_LENGTH
      );

      studentInfo.nickname = sanitizeText(
        savedStudentInfo.nickname,
        MAX_SHORT_FIELD_LENGTH
      );

      studentInfo.className = sanitizeText(
        savedStudentInfo.className,
        MAX_SHORT_FIELD_LENGTH
      );

      studentInfo.studentNumber = sanitizeText(
        savedStudentInfo.studentNumber,
        MAX_SHORT_FIELD_LENGTH
      );

      quizSections.forEach(
        (section, sectionIndex) => {
          section.questions.forEach(
            (question, questionIndex) => {
              const savedAnswer =
                savedState.answers?.[sectionIndex]?.[
                  questionIndex
                ];

              answers[sectionIndex][questionIndex] =
                sanitizeText(
                  savedAnswer,
                  MAX_ANSWER_LENGTH
                );
            }
          );
        }
      );

      currentSection = clampNumber(
        savedState.currentSection,
        0,
        quizSections.length - 1
      );

      completedCount = clampNumber(
        savedState.completedCount,
        0,
        quizSections.length
      );

      quizStarted =
        Boolean(savedState.quizStarted);

      profileComplete =
        Boolean(savedState.profileComplete);

      const consecutiveCompletedSections =
        answers.findIndex(sectionAnswers =>
          !sectionAnswers.every(answer =>
            answer.trim() !== ""
          )
        );

      const safeCompletedCount =
        consecutiveCompletedSections === -1
          ? quizSections.length
          : consecutiveCompletedSections;

      completedCount = Math.min(
        completedCount,
        safeCompletedCount
      );

      if (
        profileComplete &&
        safeCompletedCount < quizSections.length
      ) {
        profileComplete = false;

        startupNotice =
          "The saved profile was incomplete, so it was reopened at the last valid section.";
      }

      currentSection = Math.min(
        currentSection,
        Math.min(
          safeCompletedCount,
          quizSections.length - 1
        )
      );

      if (!hasCompleteStudentInfo()) {
        clearSavedState();
        resetMemoryOnly();

        startupNotice =
          "Saved progress did not contain complete student information and was safely cleared.";

        return false;
      }

      if (profileComplete) {
        completedCount = quizSections.length;
      }

      if (stored.key !== STORAGE_KEY) {
        saveState();
      }

      return true;
    }

    function hasCompleteStudentInfo() {
      return Boolean(
        studentInfo.fullName.trim() &&
        studentInfo.nickname.trim() &&
        studentInfo.className.trim() &&
        studentInfo.studentNumber.trim()
      );
    }

    function resetMemoryOnly() {
      answers.forEach(sectionAnswers => {
        sectionAnswers.fill("");
      });

      studentInfo.fullName = "";
      studentInfo.nickname = "";
      studentInfo.className = "";
      studentInfo.studentNumber = "";

      currentSection = 0;
      completedCount = 0;
      quizStarted = false;
      profileComplete = false;
    }

    function resetAllProfileData() {
      resetMemoryOnly();
      clearSavedState();
    }

    function resetQuizKeepStudent() {
      answers.forEach(sectionAnswers => {
        sectionAnswers.fill("");
      });

      currentSection = 0;
      completedCount = 0;
      quizStarted = true;
      profileComplete = false;

      saveState();
    }

    function buildPyramidHTML(allComplete = false) {
      let html = `<div class="pyramid">`;

      pyramidOrder.forEach(layer => {
        const isCompleted =
          allComplete ||
          layer.sectionIndex < completedCount;

        const isCurrent =
          !allComplete &&
          layer.sectionIndex === currentSection;

        let stateClass =
          isCompleted ? "completed" : "locked";

        if (isCurrent) {
          stateClass += " current";
        }

        const ariaCurrent =
          isCurrent ? ' aria-current="step"' : "";

        const theme =
          sectionThemes[layer.sectionIndex];

        html += `
          <div
            class="pyramid-layer ${layer.className} ${stateClass}"
            ${ariaCurrent}
          >
            <span class="layer-icon-zone">
              ${getSectionIconSVG(layer.sectionIndex)}
            </span>

            <span class="layer-copy-zone">
              <span class="layer-level">
                ${theme.level}
              </span>

              <span class="layer-title">
                ${layer.title.replace("MY ", "")}
              </span>
            </span>
          </div>
        `;
      });

      html += `</div>`;

      return html;
    }

    function setProgressImage(stage) {
      const safeStage = clampNumber(
        stage,
        0,
        quizSections.length
      );

      if (!studentImage || !studentImageFallback) {
        return;
      }

      studentImageFallback.hidden = true;
      studentImage.style.display = "block";
      studentImage.src = `assets/girl-stage-${safeStage}.png`;
      studentImage.alt =
        `Student profile progress: ${safeStage} of ${quizSections.length} sections completed`;
    }

    if (studentImage && studentImageFallback) {
      studentImage.addEventListener(
        "error",
        function () {
          this.style.display = "none";
          studentImageFallback.hidden = false;
        }
      );

      studentImage.addEventListener(
        "load",
        function () {
          this.style.display = "block";
          studentImageFallback.hidden = true;
        }
      );
    }

    function updateProgressDisplay() {
      setProgressImage(completedCount);

      progressStatus.textContent =
        `${completedCount} of ${quizSections.length} sections completed`;

      pyramidContainer.innerHTML =
        buildPyramidHTML(false);

      const futureGoalText =
        document.getElementById("future-goal-text");

      if (futureGoalText) {
        const futureJob = answers[0][1]?.trim();
        futureGoalText.textContent =
          futureJob || "Build your profile";
      }
    }

    function saveCurrentAnswers() {
      const textareas =
        document.querySelectorAll("textarea");

      textareas.forEach((textarea, index) => {
        answers[currentSection][index] =
          sanitizeText(
            textarea.value.trim(),
            MAX_ANSWER_LENGTH
          );
      });

      saveState();
    }

    function renderResumeChoice() {

      const resumeInput =

      const identityError =

      document

            if (

            ) {
              identityError.style.display = "block";
              resumeInput.setAttribute(
                "aria-invalid",

              resumeInput.focus();

      const studentForm =

              );

            firstInvalid.focus();

            values[1],

          );

    function renderSection() {

      const stepperHTML = `
        <div class="section-stepper" aria-label="Section progress">

      });

      quizContent.innerHTML = html;

      document
        .querySelectorAll(".example-button")
        .forEach(button => {
          button.addEventListener(
            "click",
            function () {
              const exampleNumber =
                this.dataset.example;

              const exampleBox =
                document.getElementById(
                  `example-${exampleNumber}`
                );

              const isVisible =
                exampleBox.style.display === "block";

              exampleBox.style.display =
                isVisible ? "none" : "block";

              this.textContent =
                isVisible
                  ? "Show example"
                  : "Hide example";

              this.setAttribute(
                "aria-expanded",
                String(!isVisible)
              );
            }
          );
        });

      document
        .querySelectorAll("textarea")
        .forEach((textarea, index) => {
          textarea.addEventListener(
            "input",
            function () {
              const safeValue = sanitizeText(
                this.value,
                MAX_ANSWER_LENGTH
              );

              if (safeValue !== this.value) {
                this.value = safeValue;
              }

              answers[currentSection][index] =
                safeValue;

              document.getElementById(
                `counter-${index}`
              ).textContent =
                `${safeValue.length} / ${MAX_ANSWER_LENGTH}`;

              this.removeAttribute(
                "aria-invalid"
              );

              saveState();
            }
          );
        });

      backButton.disabled =
        currentSection === 0;

      nextButton.textContent =
        currentSection ===
        quizSections.length - 1
          ? "Finish"
          : "Next";

      updateProgressDisplay();

      document
        .getElementById("section-heading")
        .focus();
    }

    function validateCurrentSection() {
      const textareas =
        Array.from(
          document.querySelectorAll("textarea")
        );

      let firstInvalid = null;

      textareas.forEach(textarea => {
        if (!textarea.value.trim()) {
          textarea.setAttribute(
            "aria-invalid",
            "true"
          );

          firstInvalid ||= textarea;
        } else {
          textarea.removeAttribute(
            "aria-invalid"
          );
        }
      });

      if (firstInvalid) {
        errorMessage.style.display = "block";
        firstInvalid.focus();
        return false;
      }

      errorMessage.style.display = "none";
      return true;
    }

    nextButton.addEventListener(
      "click",
      function () {
        saveCurrentAnswers();

        if (!validateCurrentSection()) {
          return;
        }

        completedCount = Math.max(
          completedCount,
          currentSection + 1
        );

        saveState();

        if (
          currentSection <
          quizSections.length - 1
        ) {
          currentSection++;
          saveState();
          renderSection();
        } else {
          showCompletionScreen();
        }
      }
    );

    backButton.addEventListener(
      "click",
      function () {
        saveCurrentAnswers();

        if (currentSection > 0) {
          currentSection--;
          saveState();
          renderSection();
        }
      }
    );

    function attachFinalImageFallback() {
      const finalImage =
        document.querySelector(
          ".final-student-image"
        );

      const finalFallback =
        document.querySelector(
          ".final-image-fallback"
        );

      if (!finalImage || !finalFallback) {
        return;
      }

      finalImage.addEventListener(
        "error",
        function () {
          this.style.display = "none";
          finalFallback.hidden = false;
        }
      );

      finalImage.addEventListener(
        "load",
        function () {
          this.style.display = "block";
          finalFallback.hidden = true;
        }
      );
    }


    const PDF_SECTION_COLORS = [
      "#9658d2",
      "#a17bd6",
      "#65b9e8",
      "#52c9c1",
      "#f1bf36",
      "#9b96a3"
    ];

    function safeFileNamePart(value) {
      const cleaned = String(value || "")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, "_")
        .replace(/_+/g, "_");

      return cleaned || "Student";
    }

    function buildPDFSectionHTML(sectionIndex) {
      const section = quizSections[sectionIndex];
      const color = PDF_SECTION_COLORS[sectionIndex];

      let sectionHTML = `
        <section
          class="pdf-export-section"
          style="--pdf-section-color:${color}"
        >
          <h2>${sectionIndex + 1}. ${escapeHTML(section.title)}</h2>
      `;

      section.questions.forEach((item, questionIndex) => {
        sectionHTML += `
          <div class="pdf-export-item">
            <p class="pdf-export-question">
              ${escapeHTML(item.question)}
            </p>
            <p class="pdf-export-answer">${formatAnswer(
              answers[sectionIndex][questionIndex]
            )}</p>
          </div>
        `;
      });

      sectionHTML += `</section>`;
      return sectionHTML;
    }

    function buildPDFPages() {
      const generatedDate = formatDateTime(new Date());

      const root = document.createElement("div");
      root.className = "pdf-export-root";
      root.setAttribute("aria-hidden", "true");

      const studentMetaHTML = `
        <div class="pdf-export-student">
          <div class="pdf-export-meta">
            <span>Student</span>
            <strong>${formatAnswer(studentInfo.fullName)}</strong>
          </div>
          <div class="pdf-export-meta">
            <span>Nickname</span>
            <strong>${formatAnswer(studentInfo.nickname)}</strong>
          </div>
          <div class="pdf-export-meta">
            <span>Class</span>
            <strong>${formatAnswer(studentInfo.className)}</strong>
          </div>
          <div class="pdf-export-meta">
            <span>Student number</span>
            <strong>${formatAnswer(studentInfo.studentNumber)}</strong>
          </div>
        </div>
      `;

      const pageHeader = pageNumber => `
        <header class="pdf-export-header">
          <div class="pdf-export-title-wrap">
            <h1>My Interview Profile</h1>
            <p>University interview preparation</p>
          </div>
          <div class="pdf-export-badge">
            Page ${pageNumber} of 3
          </div>
        </header>
      `;

      const footer = `
        <footer class="pdf-export-footer">
          ${escapeHTML(studentInfo.fullName)}
          (${escapeHTML(studentInfo.nickname)}) ·
          ${escapeHTML(studentInfo.className)} ·
          Student No. ${escapeHTML(studentInfo.studentNumber)} ·
          Generated ${escapeHTML(generatedDate)}
        </footer>
      `;

      root.innerHTML = `
        <section class="pdf-export-page">
          ${pageHeader(1)}
          ${studentMetaHTML}

          <div class="pdf-export-visual">
            <div class="pdf-export-girl-wrap">
              <img
                class="pdf-export-girl"
                src="assets/girl-stage-6.png"
                alt="Completed student interview profile"
              >
            </div>

            <div class="pdf-export-pyramid-wrap">
              ${buildPyramidHTML(true)}
            </div>
          </div>

          <div class="pdf-export-goal">
            <span>My future job</span>
            <strong>${formatAnswer(answers[0][1])}</strong>
          </div>
          ${buildPDFSectionHTML(0)}
          ${buildPDFSectionHTML(1)}
          ${footer}
        </section>

        <section class="pdf-export-page">
          ${pageHeader(2)}
          ${buildPDFSectionHTML(2)}
          ${buildPDFSectionHTML(3)}
          ${footer}
        </section>

        <section class="pdf-export-page">
          ${pageHeader(3)}
          ${buildPDFSectionHTML(4)}
          ${buildPDFSectionHTML(5)}
          ${footer}
        </section>
      `;

      document.body.appendChild(root);
      return root;
    }

    async function generateProfilePDF() {
      const status =
        document.getElementById("pdf-download-status");

      const downloadButton =
        document.getElementById("download-pdf-button");

      if (
        typeof window.html2canvas !== "function" ||
        !window.jspdf ||
        !window.jspdf.jsPDF
      ) {
        if (status) {
          status.style.display = "block";
          status.textContent =
            "PDF download could not load on this device. Use the Print / Save as PDF fallback button.";
        }
        return;
      }

      if (downloadButton) {
        downloadButton.disabled = true;
      }

      if (status) {
        status.style.display = "block";
        status.textContent =
          "Preparing your PDF… Please keep this page open.";
      }

      const exportRoot = buildPDFPages();

      try {
        // Wait for local images and layout before capturing.
        const exportImages =
          Array.from(exportRoot.querySelectorAll("img"));

        await Promise.all(
          exportImages.map(image => {
            if (image.complete) {
              return Promise.resolve();
            }

            return new Promise(resolve => {
              image.addEventListener("load", resolve, { once: true });
              image.addEventListener("error", resolve, { once: true });
            });
          })
        );

        await new Promise(resolve =>
          requestAnimationFrame(() =>
            requestAnimationFrame(resolve)
          )
        );

        const pages =
          Array.from(
            exportRoot.querySelectorAll(".pdf-export-page")
          );

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4",
          compress: true
        });

        const pageWidth = 210;
        const pageHeight = 297;

        for (let index = 0; index < pages.length; index++) {
          if (status) {
            status.textContent =
              `Preparing PDF page ${index + 1} of ${pages.length}…`;
          }

          const canvas = await window.html2canvas(
            pages[index],
            {
              backgroundColor: "#ffffff",
              scale: 1.35,
              useCORS: true,
              logging: false,
              windowWidth: 794,
              width: 794
            }
          );

          const imageData =
            canvas.toDataURL("image/jpeg", 0.93);

          if (index > 0) {
            pdf.addPage("a4", "portrait");
          }

          pdf.addImage(
            imageData,
            "JPEG",
            0,
            0,
            pageWidth,
            pageHeight,
            undefined,
            "FAST"
          );

          // Free memory as soon as possible on Android devices.
          canvas.width = 1;
          canvas.height = 1;
        }

        const fileName =
          `Interview_Profile_${safeFileNamePart(
            studentInfo.nickname || studentInfo.fullName
          )}_${safeFileNamePart(
            studentInfo.className
          )}.pdf`;

        if (status) {
          status.textContent =
            "PDF ready. Starting download…";
        }

        pdf.save(fileName);

        if (status) {
          status.textContent =
            "PDF created successfully.";
        }
      } catch (error) {
        console.error(
          "Direct PDF generation failed.",
          error
        );

        if (status) {
          status.style.display = "block";
          status.textContent =
            "Direct PDF download failed on this device. Please use Print / Save as PDF (fallback).";
        }
      } finally {
        exportRoot.remove();

        if (downloadButton) {
          downloadButton.disabled = false;
        }
      }
    }

    function showCompletionScreen() {
      clearSectionTheme();
      document.body.classList.remove(
        "student-start",
        "resume-choice"
      );

      document.body.classList.add(
        "profile-complete"
      );

      stageText.textContent =
        "Profile complete";

      completedCount =
        quizSections.length;

      quizStarted = true;
      profileComplete = true;
      saveState();

      const generatedDate =
        formatDateTime(new Date());

      let profileHTML = `
        <section class="profile-cover">

          <div class="cover-copy">

            <p class="cover-label">
              University interview preparation
            </p>

            <h2>My Interview Profile</h2>

            <p>
              This profile organizes my future goal,
              achievements, experiences, strengths,
              interests and area to improve.
            </p>

            <div class="student-details">

              <div class="student-detail">
                <span>Student</span>
                <strong>${formatAnswer(studentInfo.fullName)}</strong>
              </div>

              <div class="student-detail">
                <span>Nickname</span>
                <strong>${formatAnswer(studentInfo.nickname)}</strong>
              </div>

              <div class="student-detail">
                <span>Class</span>
                <strong>${formatAnswer(studentInfo.className)}</strong>
              </div>

              <div class="student-detail">
                <span>Student number</span>
                <strong>${formatAnswer(studentInfo.studentNumber)}</strong>
              </div>

            </div>

            <div class="goal-highlight">
              <span>My future job</span>
              <strong>${formatAnswer(answers[0][1])}</strong>
            </div>

            <p class="profile-print-meta">
              Generated: ${escapeHTML(generatedDate)}
            </p>

          </div>

          <div class="cover-visual">

            <img
              class="final-student-image"
              src="assets/girl-stage-6.png"
              alt="Completed student interview profile"
            >

            <div
              class="final-image-fallback"
              role="status"
              hidden
            >
              The final student image is unavailable. The completed pyramid and profile remain valid.
            </div>

            <div class="final-pyramid">
              ${buildPyramidHTML(true)}
            </div>

          </div>

        </section>

        <p class="profile-introduction">
          Define your goal first. Choose information
          that supports this goal.
        </p>

        <div class="profile-summary">
      `;

      quizSections.forEach(
        (section, sectionIndex) => {
          profileHTML += `
            <section
              class="profile-section section-color-${sectionIndex}"
            >

              <div class="profile-section-header">

                <span class="profile-section-number">
                  ${sectionIndex + 1}
                </span>

                <h3>${section.title}</h3>

              </div>
          `;

          section.questions.forEach(
            (item, questionIndex) => {
              profileHTML += `
                <div class="profile-item">

                  <p class="profile-question">
                    ${item.question}
                  </p>

                  <p class="profile-answer">
                    ${formatAnswer(
                      answers[sectionIndex][questionIndex]
                    )}
                  </p>

                </div>
              `;
            }
          );

          profileHTML += `</section>`;
        }
      );

      profileHTML += `
        </div>

        <footer class="profile-footer">
          My Interview Profile ·
          ${escapeHTML(studentInfo.fullName)}
          (${escapeHTML(studentInfo.nickname)}) ·
          ${escapeHTML(studentInfo.className)} ·
          Student No. ${escapeHTML(studentInfo.studentNumber)} ·
          Generated ${escapeHTML(generatedDate)}
        </footer>

        <div class="completion-actions screen-only">

          <button
            id="edit-profile-button"
            type="button"
          >
            Edit answers
          </button>

          <button
            id="download-pdf-button"
            type="button"
          >
            Download PDF
          </button>

          <button
            id="print-profile-button"
            type="button"
          >
            Print / Save as PDF (fallback)
          </button>

          <div
            id="pdf-download-status"
            class="pdf-download-status"
            role="status"
            aria-live="polite"
          ></div>

          <button
            id="restart-quiz-button"
            type="button"
          >
            Restart quiz
          </button>

          <button
            id="finish-clear-button"
            type="button"
          >
            Finish and clear saved data
          </button>

        </div>
      `;

      quizContent.innerHTML =
        profileHTML;

      backButton.style.display =
        "none";

      nextButton.style.display =
        "none";

      attachFinalImageFallback();

      document
        .getElementById(
          "edit-profile-button"
        )
        .addEventListener(
          "click",
          function () {
            currentSection = 0;
            profileComplete = false;
            saveState();

            backButton.style.display =
              "inline-block";

            nextButton.style.display =
              "inline-block";

            renderSection();
          }
        );

      document
        .getElementById(
          "download-pdf-button"
        )
        .addEventListener(
          "click",
          generateProfilePDF
        );

      document
        .getElementById(
          "print-profile-button"
        )
        .addEventListener(
          "click",
          function () {
            window.print();
          }
        );

      document
        .getElementById(
          "restart-quiz-button"
        )
        .addEventListener(
          "click",
          function () {
            const confirmed =
              window.confirm(
                `Clear all answers and restart the quiz for ${studentInfo.nickname}? Student information will be kept.`
              );

            if (!confirmed) {
              return;
            }

            resetQuizKeepStudent();

            backButton.style.display =
              "inline-block";

            nextButton.style.display =
              "inline-block";

            renderSection();
          }
        );

      document
        .getElementById(
          "finish-clear-button"
        )
        .addEventListener(
          "click",
          function () {
            const confirmed =
              window.confirm(
                "Make sure you have printed or saved your PDF. This will permanently delete the student information, answers and progress saved in this browser. Continue?"
              );

            if (!confirmed) {
              return;
            }

            resetAllProfileData();
            renderClearedScreen();
          }
        );
    }

    function renderClearedScreen() {
      clearSectionTheme();
      document.body.classList.remove(
        "profile-complete",
        "resume-choice"
      );

      document.body.classList.add(
        "student-start"
      );

      errorMessage.style.display = "none";
      stageText.textContent = "";
      backButton.style.display = "none";
      nextButton.style.display = "none";

      quizContent.innerHTML = `
        <section class="cleared-card">

          <h2>Profile finished</h2>

          <p>
            The student information, answers and progress have been removed from this browser.
          </p>

          <p>
            You may close this page safely or start another profile.
          </p>

          <button
            id="start-another-profile-button"
            type="button"
          >
            Start another profile
          </button>

        </section>
      `;

      document
        .getElementById(
          "start-another-profile-button"
        )
        .addEventListener(
          "click",
          renderStudentStart
        );
    }

    async function requestPersistentStorage() {
      try {
        if (
          navigator.storage &&
          typeof navigator.storage.persist === "function"
        ) {
          await navigator.storage.persist();
        }
      } catch (error) {
        console.warn(
          "Persistent storage could not be requested.",
          error
        );
      }
    }

    function flushVisibleAnswersBeforeLeaving() {
      if (
        !quizStarted ||
        profileComplete ||
        document.body.classList.contains("student-start") ||
        document.body.classList.contains("resume-choice")
      ) {
        saveState();
        return;
      }

      const visibleTextareas =
        document.querySelectorAll("#quiz-content textarea");

      if (visibleTextareas.length) {
        visibleTextareas.forEach((textarea, index) => {
          if (answers[currentSection]) {
            answers[currentSection][index] =
              sanitizeText(
                textarea.value,
                MAX_ANSWER_LENGTH
              );
          }
        });
      }

      saveState();
    }

    window.addEventListener(
      "pagehide",
      flushVisibleAnswersBeforeLeaving
    );

    document.addEventListener(
      "visibilitychange",
      function () {
        if (document.visibilityState === "hidden") {
          flushVisibleAnswersBeforeLeaving();
        }
      }
    );

    window.addEventListener(
      "beforeunload",
      flushVisibleAnswersBeforeLeaving
    );

    requestPersistentStorage();

    const hasSavedState =
      loadSavedState();

    if (
      hasSavedState &&
      quizStarted &&
      hasCompleteStudentInfo()
    ) {
      renderResumeChoice();
    } else {
      renderStudentStart();
    }
  </script>
